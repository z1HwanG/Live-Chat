<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="低延迟直播">
  <title>我的直播</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="siteName">直播</h1>
    <div class="stats">
      <span>观看 <b id="viewerCount">0</b></span>
      <span>在线 <b id="onlineCount">0</b></span>
    </div>
    <button id="adminBtn" class="btn-ghost">管理</button>
  </header>

  <main class="layout">
    <section class="stage">
      <div class="video-wrap">
        <video id="video" autoplay muted playsinline controls></video>
        <div id="playerStatus" class="player-status">连接中…</div>
        <div class="mode-bar">
          <button data-mode="auto" class="mode-btn active">自动</button>
          <button data-mode="webrtc" class="mode-btn">超低延迟</button>
          <button data-mode="flv" class="mode-btn">FLV</button>
          <button data-mode="hls" class="mode-btn">HLS</button>
        </div>
      </div>
      <div class="stream-info">
        <span id="streamTitle">直播间</span>
        <span id="streamStatus" class="status-pill off">未开播</span>
      </div>
    </section>

    <aside class="chat">
      <div class="chat-head">
        <span>聊天区</span>
        <span id="chatHint" class="chat-hint"></span>
      </div>
      <ul id="msgList" class="msg-list"></ul>
      <div class="chat-input">
        <input id="nickInput" maxlength="16" placeholder="昵称（必填，回车加入）">
        <div class="input-row">
          <input id="msgInput" maxlength="200" placeholder="说点什么…" disabled>
          <button id="sendBtn" disabled>发送</button>
        </div>
      </div>
    </aside>
  </main>

  <!-- 管理员面板 -->
  <div id="adminModal" class="modal hidden">
    <div class="modal-box">
      <h3>管理员</h3>
      <div id="adminLogin">
        <input type="password" id="adminPass" placeholder="管理员口令" autocomplete="off">
        <button id="adminLoginBtn" class="btn-primary">登录</button>
      </div>
      <div id="adminPanel" class="hidden">
        <p class="admin-tip">管理方式：鼠标移到消息上会出现「删除」「禁言」按钮。</p>
        <button id="adminLogoutBtn" class="btn-ghost">退出管理</button>
      </div>
      <button id="adminClose" class="modal-close">×</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/vendor/mpegts.js"></script>
  <script src="/vendor/hls.js"></script>
  <script src="/js/player.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
