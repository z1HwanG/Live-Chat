# SRS 6 配置：LiveChat 一键部署版
# 与 web 同属 compose 网络 livechat，通过服务名互访。
# 端口：容器内固定 1935/1985/8080/8000，compose 映射到宿主自定义端口（.env 可调）。
# candidate 改为服务器公网 IP（.env 的 SRS_CANDIDATE）。

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

http_api {
    enabled         on;
    listen          1985;
}

rtc_server {
    enabled         on;
    listen          8000;
    candidate       __SRS_CANDIDATE__;
}

vhost __defaultVhost__ {
    tcp_nodelay     on;
    min_latency     on;

    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
        fast_cache  0;
    }

    hls {
        enabled         on;
        hls_fragment    2;
        hls_window      6;
        hls_path        ./objs/nginx/html;
    }

    rtc {
        enabled         on;
        rtmp_to_rtc     on;
        rtc_to_rtmp     off;
    }

    # 推流鉴权：OBS 推流 URL 必须带 ?token=xxx，
    # SRS 回调同一 compose 网络内的 web 服务校验，非 {"code":0} 则拒绝推流。
    http_hooks {
        enabled         on;
        on_publish      http://web:3010/api/srs/on_publish;
        on_unpublish    http://web:3010/api/srs/on_unpublish;
    }
}